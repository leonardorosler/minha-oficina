name: Publicar na Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-na-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_API_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci --prefix backend

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@65.2.0

      - name: Ler as configurações da Vercel
        run: vercel pull --yes --environment=production

      - name: Preparar a API
        run: vercel build --prod

      - name: Publicar a API
        run: vercel deploy --prebuilt --prod

  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: minha-oficina/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --prefix minha-oficina/frontend

      - name: Instalar a CLI da Vercel
        run: npm install --global vercel@65.2.0

      - name: Ler as configurações da Vercel
        run: vercel pull --yes --environment=production

      - name: Preparar o front-end
        run: vercel build --prod

      - name: Publicar o front-end
        run: vercel deploy --prebuilt --prod
