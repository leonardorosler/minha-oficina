<html lang="pt-BR">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b67c2" />
  <meta name="description" content="Protótipo navegável do sistema Minha Oficina." />
  <title>Minha Oficina — Protótipo</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b67c2'/%3E%3Cpath d='M18 42h28M22 42V28l10-8 10 8v14M28 42V32h8v10' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <!-- O CSS contém toda a aparência da apresentação e das telas do aplicativo. -->
  <style>
/*
 * MINHA OFICINA — APARÊNCIA DO PROTÓTIPO
 * As variáveis abaixo concentram as cores principais do projeto.
 * Depois vêm: apresentação no computador, moldura do celular,
 * componentes do aplicativo, modais e ajustes responsivos.
 */
:root{--blue:#0b67c2;--blue-2:#e8f2ff;--ink:#17212b;--muted:#667085;--line:#d5e0eb;--bg:#f2f6fa;--white:#fff;--green:#16794b;--green-bg:#e8f7ef;--amber:#895800;--amber-bg:#fff3d7;--red:#b42318;--red-bg:#fff0ee;--shadow:0 24px 70px rgba(20,40,70,.18)}
/* Base e ícones. O tamanho fixo impede que o SVG ocupe o cartão inteiro. */
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:#e8eef5}button,input,textarea,select{font:inherit}button{cursor:pointer}.svg-sprite{position:absolute;width:0;height:0;overflow:hidden}.icon{display:block;flex:0 0 auto;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* Área de apresentação usada no computador. */
.presentation-shell{min-height:100vh;display:grid;grid-template-columns:minmax(280px,390px) minmax(390px,1fr);gap:clamp(28px,6vw,90px);align-items:center;max-width:1180px;margin:auto;padding:32px 44px}.presenter-panel{max-width:360px}.brand-mark{width:58px;height:58px;border-radius:18px;background:var(--blue);display:grid;place-items:center;color:white;font-weight:800;box-shadow:0 12px 28px rgba(11,103,194,.25)}.eyebrow{margin:28px 0 7px;color:var(--blue);font-size:.74rem;font-weight:800;letter-spacing:.15em}.presenter-panel h1{font-size:clamp(2.4rem,4vw,4rem);line-height:.98;margin:0;letter-spacing:-.055em}.presenter-copy{color:var(--muted);font-size:1.05rem;line-height:1.6;margin:18px 0 30px}.flow-list{display:grid;gap:8px}.flow-step{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:#546172;font-weight:700;font-size:.88rem;background:rgba(255,255,255,.45);border:1px solid transparent}.flow-step span{width:25px;height:25px;border-radius:8px;display:grid;place-items:center;background:#dce5ef;font-size:.72rem}.flow-step.active{color:var(--blue);background:white;border-color:#cfe1f4;box-shadow:0 8px 25px rgba(40,67,98,.08)}.flow-step.active span{background:var(--blue);color:#fff}.demo-tip{margin-top:24px;padding:16px;border-left:3px solid var(--blue);background:rgba(255,255,255,.6);display:grid;gap:5px;font-size:.82rem;line-height:1.45;color:var(--muted)}.demo-tip strong{color:var(--ink)}
.device-stage{display:grid;place-items:center}.phone-frame{position:relative;width:390px;height:844px;background:var(--bg);border:1px solid #cfdae5;border-radius:38px;overflow:hidden;box-shadow:var(--shadow)}.phone-status{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:12px}.app-view{height:697px;overflow-y:auto;padding:4px 20px 28px;scrollbar-width:none}.app-view::-webkit-scrollbar{display:none}.screen-header{display:flex;align-items:center;min-height:58px;margin-bottom:16px}.screen-header .title-wrap{flex:1}.kicker{font-size:10px;font-weight:800;color:var(--blue);letter-spacing:.08em}.screen-header h2{font-size:24px;line-height:1.15;margin:3px 0 0;letter-spacing:-.03em}.icon-button{width:44px;height:44px;border-radius:14px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;border:0;font-weight:800}.primary,.secondary,.ghost{min-height:46px;border-radius:14px;font-weight:800;border:0;padding:0 18px}.primary{background:var(--blue);color:#fff}.secondary{background:var(--blue-2);color:var(--blue)}.ghost{background:#fff;color:var(--blue);border:1px solid #cbdceb}.full{width:100%}.search{height:48px;background:#fff;border:1px solid var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 14px;color:#8793a2;margin-bottom:18px}.search input{border:0;outline:0;background:transparent;width:100%;font-size:13px;color:var(--ink)}.section-row{display:flex;align-items:center;justify-content:space-between;margin:12px 0 10px}.section-row h3{font-size:15px;margin:0}.section-row small{color:var(--muted)}.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.click-card{width:100%;text-align:left;color:inherit}.click-card:hover,.click-card:focus-visible{border-color:#91bce7;box-shadow:0 7px 22px rgba(11,103,194,.09);outline:0}.stats{grid-template-columns:1fr 1fr}.stat{min-height:74px;display:grid;grid-template-columns:32px 1fr;gap:9px;align-items:start}.stat-number{width:30px;height:30px;border-radius:10px;background:var(--blue-2);color:var(--blue);font-weight:800;display:grid;place-items:center}.stat strong{display:block;font-size:13px;margin:2px 0 5px}.stat small,.meta{font-size:11px;color:var(--muted)}.alert-card{display:flex;align-items:center;justify-content:space-between}.alert-card strong{font-size:12px;display:block}.alert-card small{font-size:11px;color:var(--muted)}.order-row,.person-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.order-row h4,.person-row h4{margin:0 0 5px;font-size:14px}.order-row p,.person-row p{margin:0;color:var(--muted);font-size:11px;line-height:1.5}.person-main{display:flex;align-items:center;gap:11px}.initials{width:42px;height:42px;border-radius:13px;background:var(--blue-2);color:var(--blue);font-weight:800;display:grid;place-items:center}.chevron{color:#8995a3}.badge{display:inline-flex;align-items:center;justify-content:center;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}.pending{background:var(--amber-bg);color:var(--amber)}.progress{background:var(--blue-2);color:var(--blue)}.waiting{background:#fff1e8;color:#a54912}.done{background:var(--green-bg);color:var(--green)}.danger{background:var(--red-bg);color:var(--red)}
.client-hero{display:grid;grid-template-columns:48px 1fr;gap:12px}.client-actions{grid-column:1/-1;display:flex;gap:8px}.vehicle-card{display:grid;grid-template-columns:42px 1fr;gap:10px}.vehicle-actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.car-icon{width:42px;height:42px;border-radius:12px;background:#eff4f8;display:grid;place-items:center;color:var(--blue)}.form-stack{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-size:11px;font-weight:800;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:13px;color:var(--ink);outline:none}.field textarea{min-height:74px;resize:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,103,194,.1)}.choice-card{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:11px;min-height:70px}.choice-card.selected{border-color:#9bc4eb;background:#fafdff}.choice-card strong,.option strong{display:block;font-size:13px}.choice-card small,.option small{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-top:4px}.choice-icon{width:42px;height:42px;border-radius:12px;background:var(--blue-2);color:var(--blue);display:grid;place-items:center;font-size:12px;font-weight:800}.choice-icon .icon,.car-icon .icon{width:21px;height:21px}.choice-card.disabled{opacity:.55}.compact-choice{min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:12px;font-size:11px;font-weight:800}.form-hint{margin:-3px 0 0;text-align:center;color:var(--muted);font-size:10px}.primary:disabled{opacity:.45;cursor:not-allowed}.two-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.info-strip{padding:13px 15px;border-radius:14px;background:#fff;border:1px solid var(--line)}.info-strip small{display:block;color:var(--muted);font-weight:700;margin-bottom:4px}.tabs{display:flex;gap:5px;overflow-x:auto;margin:-2px -5px 12px;padding:5px;scrollbar-width:none}.tab{border:0;border-radius:999px;padding:9px 12px;background:#e5ebf1;color:#5e6b7b;font-size:11px;font-weight:800;white-space:nowrap}.tab.active{background:var(--blue);color:#fff}.detail-top{position:relative}.detail-top h3{margin:6px 0;font-size:17px}.detail-top .badge{position:absolute;right:14px;top:12px}.link-button{border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:800;padding:9px 0 0}.timeline{list-style:none;margin:12px 0 20px;padding:0 0 0 11px}.timeline li{position:relative;min-height:48px;padding-left:32px;font-size:12px;font-weight:800;color:#738093}.timeline li:not(:last-child)::after{content:"";position:absolute;left:10px;top:22px;width:2px;height:28px;background:#d9e4ee}.timeline li::before{content:"";position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;border:1px solid #c8d6e4;background:#fff}.timeline li.complete{color:var(--ink)}.timeline li.complete::before{background:var(--blue);border-color:var(--blue)}.timeline li.complete::after{background:var(--blue)}.timeline li.complete span::before{content:"✓";position:absolute;left:5px;top:1px;color:white;font-size:11px;z-index:2}.timeline time{float:right;font-size:10px;color:var(--muted);font-weight:600}.summary{display:flex;justify-content:space-between;align-items:center}.money{font-weight:800;color:var(--ink)}
.bottom-nav{height:109px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding-top:16px;position:relative;z-index:5}.nav-item{border:0;background:transparent;color:#8b99a8;display:grid;justify-items:center;gap:5px;font-size:10px;font-weight:800;padding:0}.nav-item.active{color:var(--blue)}.nav-item.center{transform:translateY(-17px)}.nav-item.center .nav-icon{width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;border:7px solid #19b7c9;display:grid;place-items:center}.nav-icon{height:25px;display:grid;place-items:center}.nav-item.active:not(.center)::after{content:"";width:20px;height:3px;background:var(--blue);border-radius:99px}.nav-item .icon{width:21px;height:21px}
.modal-backdrop{position:absolute;inset:0;background:rgba(13,27,42,.48);z-index:20;display:grid;align-items:end;padding:18px;animation:fade .18s ease}.modal{background:#fff;border-radius:24px;padding:22px;box-shadow:0 18px 55px rgba(0,0,0,.25);animation:rise .23s ease;max-height:760px;overflow:auto}.modal h3{margin:0 0 5px;font-size:20px}.modal>p{margin:0 0 18px;color:var(--muted);font-size:12px}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.option-list{display:grid;gap:8px}.option{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);font-weight:700}.option.active{border-color:var(--blue);background:var(--blue-2);color:var(--blue)}.client-option,.vehicle-option{display:grid;grid-template-columns:42px 1fr;align-items:center}.client-option .initials{width:38px;height:38px}.vehicle-option .car-icon{width:38px;height:38px}.radio{width:18px;height:18px;border-radius:50%;border:2px solid #b7c5d3;display:grid;place-items:center}.option.active .radio{border-color:var(--blue)}.option.active .radio::after{content:"";width:8px;height:8px;background:var(--blue);border-radius:50%}.toast{position:absolute;left:20px;right:20px;bottom:125px;padding:13px 15px;border-radius:13px;background:#132334;color:#fff;font-size:12px;font-weight:700;z-index:30;opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateY(0)}.empty{text-align:center;padding:34px 15px;color:var(--muted)}.empty strong{display:block;color:var(--ink);margin-bottom:6px}
.flow-step{width:100%;text-align:left}.flow-step:hover,.flow-step:focus-visible{background:#fff;border-color:#cfe1f4;outline:0}
@keyframes fade{from{opacity:0}}@keyframes rise{from{transform:translateY(20px);opacity:.5}}
@media(max-width:760px){body{background:var(--bg)}.presentation-shell{display:block;padding:0}.presenter-panel{display:none}.phone-frame{width:100%;height:100dvh;border:0;border-radius:0;box-shadow:none}.app-view{height:calc(100dvh - 147px)}.device-stage{display:block}}
/* Em notebooks baixos, reduzimos o aparelho inteiro para ele não ser cortado. */
@media(max-height:900px) and (min-width:761px){.presentation-shell{padding-top:18px;padding-bottom:18px}.phone-frame{transform:scale(.84)}.device-stage{height:709px}}
@media(max-height:760px) and (min-width:761px){.presentation-shell{padding-top:12px;padding-bottom:12px}.phone-frame{transform:scale(.72)}.device-stage{height:608px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

<body>
  <!-- Biblioteca de ícones: cada symbol é reutilizado pelo JavaScript. -->
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9.5 20v-6h5v6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20v-2.3c0-3 2.4-5.2 6-5.2s6 2.2 6 5.2V20M16 5.5c2.2.2 3.5 1.5 3.5 3.5S18 12.3 16 12.5M17 14c2.6.5 4 2.2 4 4.5V20"/></symbol>

  <!-- A apresentação tem duas partes: roteiro à esquerda e aplicativo à direita. -->
  <main class="presentation-shell">
    <aside class="presenter-panel">
      <div class="brand-mark"><span>MO</span></div>
      <p class="eyebrow">PROTÓTIPO NAVEGÁVEL</p>
      <h1>Minha Oficina</h1>
      <p class="presenter-copy">Gestão simples e organizada para oficinas mecânicas.</p>
      <div class="flow-list" id="flowList"></div>
      <div class="demo-tip"><strong>Fluxo sugerido</strong><span>Abra Maria Oliveira, selecione o Corsa, crie uma OS e atualize seu status.</span></div>
    </aside>

    <!-- Moldura do celular que recebe as telas criadas pelo aplicacao.js. -->
    <section class="device-stage" aria-label="Protótipo do aplicativo Minha Oficina">
      <div class="phone-frame">
        <div class="phone-status"><strong>9:41</strong><span>••• ▰</span></div>
        <div id="app" class="app-view" aria-live="polite"></div>
        <nav id="bottomNav" class="bottom-nav" aria-label="Navegação principal"></nav>
        <div id="modalRoot"></div>
        <div id="toast" class="toast" role="status"></div>
      </div>
    </section>
  </main>
  <!-- O JavaScript controla navegação, botões, filtros, modais e mensagens. -->
  <script>
/*
 * MINHA OFICINA — LÓGICA DO PROTÓTIPO
 *
 * Este projeto usa JavaScript puro. Não há banco de dados nem servidor:
 * os dados abaixo são exemplos e ficam apenas na memória enquanto a aba está aberta.
 *
 * Alguns nomes técnicos permanecem em inglês porque também são nomes de classes do CSS.
 * Isso evita quebrar a aparência da interface. Tradução rápida:
 * screens = telas, state = estado, render = atualizar a tela,
 * header = cabeçalho, card = cartão e modal = janela sobreposta.
 */

// Ordem das telas exibidas no roteiro lateral da apresentação.
const screens=[['painel','Painel'],['clientes','Clientes'],['veiculos','Cliente + veículos'],['nova-os','Nova OS'],['ordens','Ordens'],['detalhe','Detalhe da OS'],['historico','Histórico']];

// Dados fictícios usados para demonstrar a relação cliente -> veículos.
const clients=[
  {id:'maria',initials:'MO',name:'Maria Oliveira',phone:'(53) 99123-4567',vehicles:[
    {id:'corsa',name:'Chevrolet Corsa',plate:'ABC-1D23',year:'2012',color:'Prata'},
    {id:'biz',name:'Honda Biz',plate:'DEF-9G87',year:'2020',color:'Vermelha'}]},
  {id:'joao',initials:'JP',name:'João Pereira',phone:'(53) 98456-1122',vehicles:[
    {id:'uno',name:'Fiat Uno',plate:'IJK-4E56',year:'2015',color:'Branco'},
    {id:'factor',name:'Yamaha Factor',plate:'KLM-8H90',year:'2021',color:'Preta'}]},
  {id:'ana',initials:'AS',name:'Ana Souza',phone:'(53) 99876-3344',vehicles:[
    {id:'gol',name:'Volkswagen Gol',plate:'MNO-7F89',year:'2018',color:'Prata'}]},
  {id:'paulo',initials:'PL',name:'Paulo Lima',phone:'(53) 98888-9900',vehicles:[
    {id:'fit',name:'Honda Fit',plate:'PQR-2A10',year:'2019',color:'Cinza'},
    {id:'ka',name:'Ford Ka',plate:'STU-5B67',year:'2016',color:'Branco'}]}
];

// Estado atual do protótipo. Alterar estes valores muda o exemplo inicial.
const state={screen:location.hash.slice(1)||'painel',status:'Pendente',responsavel:'Rafael',prioridade:'Normal',orderCreated:false,filter:'Todas',modal:null,viewClientId:'maria',orderClientId:null,orderVehicleId:null};

// Monta um ícone SVG reutilizando os símbolos declarados no arquivo index.html.
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"></use></svg>`;

// Itens da barra de navegação inferior do celular.
const navItems=[['painel','home','Painel'],['clientes','users','Clientes'],['nova-os','plus','Nova OS'],['ordens','clipboard','Ordens'],['historico','history','Histórico']];
const statusClass=s=>s==='Pendente'?'pending':s==='Em andamento'?'progress':s==='Aguardando peça'?'waiting':'done';

// Funções de navegação e abertura/fechamento das janelas modais.
function go(s){state.screen=s;location.hash=s;state.modal=null;render()}
function openNewOrder(clientId=null,vehicleId=null){state.orderClientId=clientId;state.orderVehicleId=vehicleId;go('nova-os')}
function openClient(clientId){state.viewClientId=clientId;go('veiculos')}
function openModal(name,data={}){state.modal={name,...data};renderModal()}
function closeModal(){state.modal=null;renderModal()}

// Componentes pequenos usados em várias telas.
function header(title,{back=false,action='',actionLabel='',avatar=false}={}){return `<header class="screen-header">${back?`<button class="icon-button" onclick="history.back()" aria-label="Voltar">${icon('back')}</button>`:''}<div class="title-wrap"><span class="kicker">MINHA OFICINA</span><h2>${title}</h2></div>${action?`<button class="${avatar?'avatar':actionLabel?'primary':'icon-button'}" onclick="${action}" aria-label="${avatar?'Abrir perfil':actionLabel||'Mais opções'}">${avatar?'CC':actionLabel||icon('more')}</button>`:''}</header>`}
function search(ph){return `<label class="search">${icon('search')}<input aria-label="${ph}" placeholder="${ph}"></label>`}
function orderCard(id,car,person,status,detail=''){return `<button class="card click-card order-row" onclick="go('detalhe')"><div><h4>OS #${id}</h4><p><strong>${car}</strong><br>${person}${detail?` · ${detail}`:''}</p></div><div><span class="badge ${statusClass(status)}">${status}</span><span class="chevron">${icon('chevron')}</span></div></button>`}

// Cada função abaixo representa uma tela do aplicativo.
function painel(){return `${header('Bom dia, Carlos',{action:"openModal('perfil')",avatar:true})}${search('Buscar cliente, placa ou OS')}<div class="section-row"><h3>Resumo de hoje</h3></div><div class="cards stats">${[['12','Todas'],['4','Pendentes'],['5','Em andamento'],['3','Prontas']].map(([n,l])=>`<button class="card click-card stat" onclick="state.filter='${l}';go('ordens')"><span class="stat-number">${n}</span><span><strong>${l}</strong><small>Toque para filtrar</small></span></button>`).join('')}</div><div class="cards" style="margin-top:10px"><button class="card click-card alert-card" onclick="openModal('responsavel')"><span><strong>2 OS sem responsável</strong><small>Definir um mecânico agora</small></span>${icon('chevron')}</button><button class="card click-card alert-card" onclick="state.filter='Aguardando peça';go('ordens')"><span><strong>1 OS aguardando peça</strong><small>Ver ordens bloqueadas</small></span>${icon('chevron')}</button></div><div class="section-row"><h3>Ordens recentes</h3><button class="link-button" onclick="go('ordens')">Ver todas</button></div><div class="cards">${orderCard('1048','Chevrolet Corsa 2012','Maria Oliveira','Pendente','Sem responsável')}${orderCard('1047','Fiat Uno 2015','João Pereira','Em andamento','Rafael')}${orderCard('1046','VW Gol 2018','Ana Souza','Aguardando peça','Carlos')}</div>`}
function clientes(){return `${header('Clientes',{action:"openModal('cadastroCliente')",actionLabel:'+ Cadastrar'})}${search('Buscar cliente, telefone ou placa')}<div class="section-row"><h3>Clientes cadastrados</h3><small>28 clientes</small></div><div class="cards">${clients.map(c=>`<button class="card click-card person-row" onclick="openClient('${c.id}')"><span class="person-main"><span class="initials">${c.initials}</span><span><h4>${c.name}</h4><p>${c.phone}<br>${c.vehicles.length} ${c.vehicles.length===1?'veículo':'veículos'} · ${c.vehicles[0].plate}</p></span></span>${icon('chevron')}</button>`).join('')}</div>`}
function veiculos(){const client=clients.find(c=>c.id===state.viewClientId)||clients[0];return `${header('Cliente e veículos',{back:true,action:"openModal('editarCliente')"})}<div class="card client-hero"><span class="initials">${client.initials}</span><span><h3 style="margin:2px 0 5px">${client.name}</h3><span class="meta">Cliente desde 2024</span></span><div class="client-actions"><button class="secondary" onclick="showToast('Ligação simulada para ${client.name}')">${icon('phone')} Ligar</button><button class="ghost" onclick="openModal('editarCliente')">${icon('edit')} Editar</button></div></div><div class="section-row"><h3>Veículos</h3><button class="primary" onclick="openModal('cadastroVeiculo')">+ Cadastrar</button></div><div class="cards">${client.vehicles.map(v=>vehicle(client,v)).join('')}</div><div class="section-row"><h3>Última ordem</h3></div>${orderCard('1048',`${client.vehicles[0].name} ${client.vehicles[0].year}`,'Troca de correia','Pendente','Aberta hoje às 08:42')}`}
function vehicle(client,v){return `<div class="card vehicle-card"><span class="car-icon">${icon('car')}</span><span><h4 style="margin:2px 0 5px">${v.name}</h4><span class="meta">${v.plate} · ${v.year} · ${v.color}</span></span><div class="vehicle-actions"><button class="ghost" onclick="openModal('cadastroVeiculo',{edit:true})">Editar veículo</button><button class="primary" onclick="openNewOrder('${client.id}','${v.id}')">+ Nova OS</button></div></div>`}
function novaOs(){const client=clients.find(c=>c.id===state.orderClientId);const selectedVehicle=client?.vehicles.find(v=>v.id===state.orderVehicleId);const ready=Boolean(client&&selectedVehicle);return `${header('Nova OS',{back:true})}<div class="form-stack"><div class="field"><label>Cliente</label><button class="card click-card choice-card ${client?'selected':''}" onclick="openModal('clienteOs')"><span class="choice-icon">${client?client.initials:icon('users')}</span><span><strong>${client?client.name:'Selecionar cliente'}</strong><small>${client?client.phone:'Escolha quem será atendido'}</small></span>${icon('chevron')}</button></div><div class="field"><label>Veículo</label><button class="card click-card choice-card ${selectedVehicle?'selected':''} ${client?'':'disabled'}" onclick="${client?"openModal('veiculoOs')":"showToast('Selecione um cliente primeiro')"}"><span class="choice-icon">${icon('car')}</span><span><strong>${selectedVehicle?selectedVehicle.name:'Selecionar veículo'}</strong><small>${selectedVehicle?`${selectedVehicle.plate} · ${selectedVehicle.year} · ${selectedVehicle.color}`:client?`Escolha entre ${client.vehicles.length} ${client.vehicles.length===1?'veículo':'veículos'}`:'Disponível após selecionar o cliente'}</small></span>${icon('chevron')}</button></div><div class="field"><label>Serviço solicitado</label><input value="Troca de correia" aria-label="Serviço solicitado"></div><div class="field"><label>Problema relatado</label><textarea aria-label="Problema relatado">Barulho no motor e dificuldade para ligar pela manhã.</textarea></div><div class="two-cols"><div class="field"><label>Responsável</label><button class="card click-card compact-choice" onclick="openModal('responsavel')">${state.responsavel} ${icon('chevron')}</button></div><div class="field"><label>Prioridade</label><button class="card click-card compact-choice" onclick="openModal('prioridade')">${state.prioridade} ${icon('chevron')}</button></div></div><div class="info-strip"><small>Status inicial</small><strong>Pendente</strong></div>${ready?'':`<p class="form-hint">Selecione o cliente e o veículo para criar a ordem.</p>`}<button class="primary full" onclick="createOrder()" ${ready?'':'disabled'}>Criar ordem de serviço</button></div>`}
function ordens(){const client=clients.find(c=>c.id===state.orderClientId);const selectedVehicle=client?.vehicles.find(v=>v.id===state.orderVehicleId);const created=state.orderCreated&&client&&selectedVehicle?[['1049',`${selectedVehicle.name} ${selectedVehicle.year}`,client.name,'Pendente']]:[];const all=[...created,['1048','Chevrolet Corsa 2012','Maria Oliveira','Pendente'],['1047','Fiat Uno 2015','João Pereira','Em andamento'],['1046','VW Gol 2018','Ana Souza','Aguardando peça'],['1045','Honda Fit 2019','Paulo Lima','Pronta']];const visible=state.filter==='Todas'?all:all.filter(o=>o[3]===state.filter||state.filter==='Pendentes'&&o[3]==='Pendente'||state.filter==='Prontas'&&o[3]==='Pronta');return `${header('Ordens',{action:"openModal('filtros')"})}${search('Buscar por OS, cliente ou placa')}<div class="section-row"><h3>Ordens de serviço</h3><button class="icon-button" onclick="openModal('filtros')" aria-label="Filtros">${icon('filter')}</button></div><div class="tabs">${['Todas','Pendentes','Em andamento','Prontas'].map(f=>`<button class="tab ${state.filter===f?'active':''}" onclick="state.filter='${f}';render()">${f}</button>`).join('')}</div><div class="cards">${visible.length?visible.map(o=>orderCard(...o)).join(''):`<div class="empty"><strong>Nenhuma ordem encontrada</strong>Tente selecionar outro filtro.</div>`}</div>`}
function detalhe(){const steps=['Recebida','Diagnóstico','Orçamento','Serviço','Pronta'];const idx=state.status==='Pendente'?0:state.status==='Em andamento'?1:state.status==='Aguardando peça'?2:4;return `${header('Detalhe da OS',{back:true,action:"openModal('mais')"})}<div class="card detail-top"><span class="kicker">OS #1048</span><span class="badge ${statusClass(state.status)}">${state.status}</span><h3>Chevrolet Corsa 2012</h3><span class="meta">ABC-1D23 · Maria Oliveira</span><br><button class="link-button" onclick="go('veiculos')">Ver cliente e veículo</button></div><div class="section-row"><h3>Andamento da OS</h3></div><ol class="timeline">${steps.map((s,i)=>`<li class="${i<=idx?'complete':''}"><span>${s}</span>${i===0?'<time>Hoje, 08:42</time>':''}</li>`).join('')}</ol><div class="cards"><div class="card"><span class="meta">Problema relatado</span><p style="font-size:12px;font-weight:700;margin:8px 0 0">Barulho no motor e dificuldade para ligar.</p></div><div class="card ${state.responsavel==='Ainda não definido'?'danger':''}"><span class="meta">Responsável</span><p style="font-size:12px;font-weight:800;margin:8px 0 0">${state.responsavel}</p></div></div><button class="primary full" style="margin-top:16px" onclick="openModal('status')">Atualizar status</button>`}
function historico(){return `${header('Histórico')}${search('Buscar cliente, placa ou serviço')}<div class="section-row"><h3>Serviços finalizados</h3><button class="icon-button" onclick="openModal('periodo')">${icon('filter')}</button></div><div class="tabs"><button class="tab active">30 dias</button><button class="tab">3 meses</button><button class="tab">2026</button><button class="tab" onclick="openModal('periodo')">Escolher data</button></div><div class="info-strip summary"><span>42 serviços no período</span><span class="money">R$ 18.740,00</span></div><div class="cards" style="margin-top:12px">${[['1039','Chevrolet Corsa 2012','Maria Oliveira'],['1034','Fiat Uno 2015','João Pereira'],['1028','Honda Fit 2019','Paulo Lima']].map(o=>`<button class="card click-card order-row" onclick="go('detalhe')"><span><h4>OS #${o[0]}</h4><p><strong>${o[1]}</strong><br>${o[2]} · 08/09/2026</p></span><span><span class="badge done">Finalizada</span><p class="money">R$ 480,00</p></span></button>`).join('')}</div>`}
// Liga o nome da rota à função que desenha a tela correspondente.
const views={painel,clientes,veiculos,'nova-os':novaOs,ordens,detalhe,historico};

// Atualiza a tela central, o menu inferior e o roteiro lateral.
function render(){document.getElementById('app').innerHTML=(views[state.screen]||painel)();const activeNav=state.screen==='detalhe'?'ordens':state.screen==='veiculos'?'clientes':state.screen;document.getElementById('bottomNav').innerHTML=navItems.map(([s,i,l])=>`<button type="button" class="nav-item ${activeNav===s?'active':''} ${s==='nova-os'?'center':''}" onclick="${s==='nova-os'?'openNewOrder()':`go('${s}')`}"><span class="nav-icon">${icon(i)}</span><span>${l}</span></button>`).join('');document.getElementById('flowList').innerHTML=screens.map(([s,l],i)=>`<button type="button" class="flow-step ${state.screen===s?'active':''}" onclick="${s==='nova-os'?'openNewOrder()':`go('${s}')`}"><span>${String(i+1).padStart(2,'0')}</span>${l}</button>`).join('');renderModal();document.getElementById('app').scrollTop=0}

// Estrutura comum das janelas modais e das listas de opções.
function modalShell(title,desc,content,save=''){return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true"><h3>${title}</h3><p>${desc}</p>${content}${save?`<div class="modal-actions"><button class="ghost" onclick="closeModal()">Cancelar</button><button class="primary" onclick="${save}">Salvar</button></div>`:''}</section></div>`}
function options(items,current,handler){return `<div class="option-list">${items.map(x=>`<button class="option ${x===current?'active':''}" onclick="${handler}('${x}')"><span class="radio"></span>${x}</button>`).join('')}</div>`}
function renderModal(){const root=document.getElementById('modalRoot');if(!state.modal){root.innerHTML='';return}const m=state.modal.name;let html='';if(m==='clienteOs')html=modalShell('Selecionar cliente','Escolha o cliente que será atendido.',`<div class="option-list">${clients.map(c=>`<button class="option client-option ${c.id===state.orderClientId?'active':''}" onclick="setOrderClient('${c.id}')"><span class="initials">${c.initials}</span><span><strong>${c.name}</strong><small>${c.phone} · ${c.vehicles.length} ${c.vehicles.length===1?'veículo':'veículos'}</small></span></button>`).join('')}</div>`);
else if(m==='veiculoOs'){const client=clients.find(c=>c.id===state.orderClientId);html=modalShell('Selecionar veículo',client?`Veículos cadastrados para ${client.name}.`:'Selecione um cliente primeiro.',`<div class="option-list">${client?client.vehicles.map(v=>`<button class="option vehicle-option ${v.id===state.orderVehicleId?'active':''}" onclick="setOrderVehicle('${v.id}')"><span class="car-icon">${icon('car')}</span><span><strong>${v.name}</strong><small>${v.plate} · ${v.year} · ${v.color}</small></span></button>`).join(''):'<div class="empty">Nenhum cliente selecionado.</div>'}</div>`)}
else if(m==='status')html=modalShell('Atualizar status','Selecione a nova etapa da ordem de serviço.',options(['Pendente','Em andamento','Aguardando peça','Pronta'],state.status,'setStatus'));
else if(m==='responsavel')html=modalShell('Selecionar responsável','Defina quem ficará responsável pela ordem.',options(['Rafael','Carlos','Fernanda','Ainda não definido'],state.responsavel,'setResponsavel'));
else if(m==='prioridade')html=modalShell('Selecionar prioridade','Escolha a urgência deste atendimento.',options(['Baixa','Normal','Alta','Urgente'],state.prioridade,'setPrioridade'));
else if(m==='filtros')html=modalShell('Filtrar ordens','Mostre apenas as ordens que você precisa.',options(['Todas','Pendentes','Em andamento','Aguardando peça','Prontas'],state.filter,'setFilter'));
else if(m==='cadastroCliente'||m==='editarCliente')html=modalShell(m==='cadastroCliente'?'Cadastrar cliente':'Editar cliente','Preencha os dados principais do cliente.',`<div class="form-stack"><div class="field"><label>Nome completo</label><input id="modalName" value="${m==='editarCliente'?'Maria Oliveira':''}"></div><div class="field"><label>Telefone</label><input value="${m==='editarCliente'?'(53) 99123-4567':''}"></div></div>`,`saveGeneric('${m==='cadastroCliente'?'Cliente cadastrado':'Dados atualizados'}')`);
else if(m==='cadastroVeiculo')html=modalShell(state.modal.edit?'Editar veículo':'Cadastrar veículo','Informe os dados do veículo.',`<div class="form-stack"><div class="field"><label>Modelo</label><input value="${state.modal.edit?'Chevrolet Corsa':''}"></div><div class="two-cols"><div class="field"><label>Placa</label><input value="${state.modal.edit?'ABC-1D23':''}"></div><div class="field"><label>Ano</label><input value="${state.modal.edit?'2012':''}"></div></div></div>`,`saveGeneric('${state.modal.edit?'Veículo atualizado':'Veículo cadastrado'}')`);
else if(m==='periodo')html=modalShell('Escolher período','Selecione as datas para consultar o histórico.',`<div class="two-cols"><div class="field"><label>Início</label><input type="date" value="2026-09-01"></div><div class="field"><label>Fim</label><input type="date" value="2026-09-30"></div></div>`,`saveGeneric('Período atualizado')`);
else if(m==='mais')html=modalShell('Opções da OS','Escolha uma ação.',`<div class="option-list"><button class="option" onclick="showToast('Orçamento compartilhado');closeModal()">Compartilhar orçamento</button><button class="option" onclick="showToast('Impressão simulada');closeModal()">Imprimir ordem</button><button class="option" onclick="showToast('OS marcada como cancelada');closeModal()">Cancelar ordem</button></div>`);
else html=modalShell('Perfil da oficina','Usuário conectado ao protótipo.',`<div class="card person-row"><span class="person-main"><span class="initials">CC</span><span><h4>Carlos Costa</h4><p>Administrador da oficina</p></span></span></div>`);root.innerHTML=html}
// Ações executadas pelos botões do protótipo.
function setOrderClient(id){state.orderClientId=id;state.orderVehicleId=null;closeModal();render();showToast('Cliente selecionado. Agora escolha o veículo.')}
function setOrderVehicle(id){state.orderVehicleId=id;closeModal();render();showToast('Veículo selecionado')}
function setStatus(v){state.status=v;closeModal();render();showToast(`Status atualizado para ${v}`)}function setResponsavel(v){state.responsavel=v;closeModal();render();showToast(`Responsável: ${v}`)}function setPrioridade(v){state.prioridade=v;closeModal();render();showToast(`Prioridade: ${v}`)}function setFilter(v){state.filter=v;closeModal();render()}function saveGeneric(msg){closeModal();showToast(msg)}function createOrder(){if(!state.orderClientId||!state.orderVehicleId){showToast('Selecione o cliente e o veículo');return}state.orderCreated=true;state.status='Pendente';state.filter='Todas';showToast('OS #1049 criada com sucesso');setTimeout(()=>go('ordens'),650)}
let toastTimer;function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}

// Expõe as ações usadas nos atributos onclick, inclusive ao abrir o arquivo pelo computador.
Object.assign(window,{go,openNewOrder,openClient,openModal,closeModal,setOrderClient,setOrderVehicle,setStatus,setResponsavel,setPrioridade,setFilter,saveGeneric,createOrder,showToast});
window.addEventListener('hashchange',()=>{state.screen=location.hash.slice(1)||'painel';render()});render();

</script>
</body>
</html>
