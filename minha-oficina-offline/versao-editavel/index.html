<!doctype html>
<html lang="pt-BR">
<head>
  <!-- Configurações básicas para o protótipo funcionar bem no computador e no celular. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b67c2" />
  <meta name="description" content="Protótipo navegável do sistema Minha Oficina." />
  <title>Minha Oficina — Protótipo</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b67c2'/%3E%3Cpath d='M18 42h28M22 42V28l10-8 10 8v14M28 42V32h8v10' fill='none' stroke='white' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <!-- O CSS contém toda a aparência da apresentação e das telas do aplicativo. -->
  <link rel="stylesheet" href="./estilos.css" />
</head>
<body>
  <!-- Biblioteca de ícones: cada symbol é reutilizado pelo JavaScript. -->
  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5M5.5 10v10h13V10M9.5 20v-6h5v6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20v-2.3c0-3 2.4-5.2 6-5.2s6 2.2 6 5.2V20M16 5.5c2.2.2 3.5 1.5 3.5 3.5S18 12.3 16 12.5M17 14c2.6.5 4 2.2 4 4.5V20"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-clipboard" viewBox="0 0 24 24"><path d="M8 5H5v16h14V5h-3M9 3h6v4H9zM8 11h8M8 15h8"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 4v6h6M5.5 9A8 8 0 1 1 4 14M12 8v5l3 2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="m5 15 1.5-5h11L19 15M3 15h18v4H3zM6 19v2M18 19v2M7 15h.01M17 15h.01"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M7 3H4.5A1.5 1.5 0 0 0 3 4.5C3 13.6 10.4 21 19.5 21a1.5 1.5 0 0 0 1.5-1.5V17l-5-1-1.2 3a16 16 0 0 1-9.8-9.8L8 8z"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m4 20 4.5-1 10-10-3.5-3.5-10 10zM13.5 7 17 10.5"/></symbol>
  </svg>

  <!-- A apresentação tem duas partes: roteiro à esquerda e aplicativo à direita. -->
  <main class="presentation-shell">
    <aside class="presenter-panel">
      <div class="brand-mark"><span>MO</span></div>
      <p class="eyebrow">PROTÓTIPO NAVEGÁVEL</p>
      <h1>Minha Oficina</h1>
      <p class="presenter-copy">Gestão simples e organizada para oficinas mecânicas.</p>
      <div class="flow-list" id="flowList"></div>
      <div class="demo-tip"><strong>Fluxo sugerido</strong><span>Abra Maria Oliveira, selecione o Corsa, crie uma OS e atualize seu status.</span></div>
    </aside>

    <!-- Moldura do celular que recebe as telas criadas pelo aplicacao.js. -->
    <section class="device-stage" aria-label="Protótipo do aplicativo Minha Oficina">
      <div class="phone-frame">
        <div class="phone-status"><strong>9:41</strong><span>••• ▰</span></div>
        <div id="app" class="app-view" aria-live="polite"></div>
        <nav id="bottomNav" class="bottom-nav" aria-label="Navegação principal"></nav>
        <div id="modalRoot"></div>
        <div id="toast" class="toast" role="status"></div>
      </div>
    </section>
  </main>
  <!-- O JavaScript controla navegação, botões, filtros, modais e mensagens. -->
  <script src="./aplicacao.js"></script>
</body>
</html>
